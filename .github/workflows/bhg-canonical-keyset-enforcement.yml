name: BHG Canonical Metadata Keyset Enforcement

on:
  push:
    branches:
      - normalization/N3-N5-remediation-v0.1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install YAML parser
        run: python -m pip install pyyaml
      - name: Enforce canonical keyset
        run: python tools/bhg_normalization/enforce_canonical_keyset.py
      - name: Commit keyset normalization
        run: |
          git config user.name "BHG Normalization Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Canonical keyset already satisfied."
            exit 0
          fi
          git add -- '*.md'
          git commit -m "normalization: enforce canonical metadata keyset"
          git push origin HEAD:normalization/N3-N5-remediation-v0.1