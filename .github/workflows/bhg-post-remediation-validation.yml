name: BHG Post-Remediation N3-N5 Validation

on:
  push:
    branches:
      - normalization/N3-N5-remediation-v0.1
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Install YAML parser
        run: python -m pip install pyyaml
      - name: Validate N3-N5 exit conditions
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import defaultdict
          import yaml, json, sys

          # Only governed documentation is part of the N3-N5 corpus.
          # Generated artifacts under normalization-output/, repository tooling,
          # and root-level project files are evidence/infrastructure, not governed documents.
          docs=sorted(Path('docs').rglob('*.md'))

          required=['title','document_id','document_type','version','status','governance_level','owner','approval_authority','created','last_updated','classification','language','repository']
          allowed_status={'Concept','Draft','Review','Approved','Active','Effective','Deprecated','Archived'}
          allowed_keys=set(required) | {
              'effective_date','canonical','effective','governed_by','governs','depends_on','related_to',
              'supersedes','superseded_by','references','implements','implemented_by','replaces','replaced_by',
              'extensions'
          }

          ids=defaultdict(list); invalid_status=[]; missing=[]; nofm=0; unknown_keys=[]
          for p in docs:
              t=p.read_text(encoding='utf-8',errors='replace')
              if not t.startswith('---\n'):
                  nofm+=1; fm={}
              else:
                  end=t.find('\n---',4)
                  try:
                      fm=yaml.safe_load(t[4:end]) or {} if end>=0 else {}
                  except Exception:
                      fm={}
              miss=[k for k in required if k not in fm or fm[k] is None]
              if miss: missing.append((str(p),miss))
              did=fm.get('document_id')
              if did: ids[str(did)].append(str(p))
              unknown=sorted(set(fm)-allowed_keys)
              if unknown: unknown_keys.append((str(p),unknown))
              if fm.get('status') not in allowed_status: invalid_status.append((str(p),fm.get('status')))

          dup={k:v for k,v in ids.items() if len(v)>1}
          out=Path('post-remediation-evidence'); out.mkdir(exist_ok=True)
          report={
              'scope':'docs/**/*.md',
              'documents':len(docs),
              'missing_frontmatter':nofm,
              'metadata_gap_documents':len(missing),
              'duplicate_ids':dup,
              'unknown_metadata_keys':unknown_keys,
              'invalid_status':invalid_status
          }
          (out/'n3-n5-exit-evidence.json').write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding='utf-8')

          blockers=[]
          if nofm: blockers.append('missing frontmatter')
          if missing: blockers.append('required metadata gaps')
          if dup: blockers.append('duplicate document IDs')
          if unknown_keys: blockers.append('non-canonical metadata keys')
          if invalid_status: blockers.append('invalid lifecycle statuses')

          md=[
              '# BHG N3-N5 Post-Remediation Exit Evidence','',
              f'- Governed Markdown documents: **{len(docs)}**',
              f'- Missing frontmatter: **{nofm}**',
              f'- Documents with metadata gaps: **{len(missing)}**',
              f'- Duplicate document IDs: **{len(dup)}**',
              f'- Documents with non-canonical metadata keys: **{len(unknown_keys)}**',
              f'- Invalid lifecycle statuses: **{len(invalid_status)}**','',
              '**PASS — structural N3 metadata/identity exit conditions.**' if not blockers else '**CONDITIONAL FAIL:** '+', '.join(blockers), '',
              'Validation is observational and does not approve, canonicalize, or activate normative artifacts.'
          ]
          (out/'n3-n5-exit-evidence.md').write_text('\n'.join(md)+'\n',encoding='utf-8')
          print(json.dumps(report,indent=2,ensure_ascii=False))
          if blockers: sys.exit(1)
          PY
      - name: Upload post-remediation evidence
        uses: actions/upload-artifact@v4
        with:
          name: bhg-n3-n5-post-remediation-evidence
          path: post-remediation-evidence/
