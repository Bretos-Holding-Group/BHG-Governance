name: BHG Status Inventory Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  status-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inventory governed document statuses
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          import csv, hashlib, json, re
          from datetime import datetime, timezone

          root=Path('docs')
          docs=sorted(root.rglob('*.md'))
          rows=[]
          for p in docs:
              t=p.read_text(encoding='utf-8', errors='replace')
              status='MISSING_FRONTMATTER'; did=''; version=''
              if t.startswith('---\n'):
                  e=t.find('\n---',4)
                  if e>=0:
                      fm=t[4:e]
                      for line in fm.splitlines():
                          m=re.match(r'^(document_id|version|status):\s*(.*)$',line)
                          if m:
                              value=m.group(2).strip().strip("'\"")
                              if m.group(1)=='status': status=value
                              elif m.group(1)=='document_id': did=value
                              else: version=value
              rows.append((str(p),did,version,status))

          out=Path('status-inventory')
          out.mkdir()
          with (out/'status-inventory.csv').open('w',newline='',encoding='utf-8') as f:
              w=csv.writer(f); w.writerow(['path','document_id','version','status']); w.writerows(rows)
          counts=Counter(r[3] for r in rows)
          summary={'document_count':len(rows),'status_counts':dict(sorted(counts.items()))}
          (out/'status-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          manifest={
              'repository':'Bretos-Holding-Group/BHG-Governance',
              'scope':'docs/**/*.md',
              'commit_sha':__import__('os').environ.get('GITHUB_SHA',''),
              'workflow_run_id':__import__('os').environ.get('GITHUB_RUN_ID',''),
              'generated_at':datetime.now(timezone.utc).isoformat(),
              'document_count':len(rows),
              'status_counts':dict(sorted(counts.items())),
              'evidence_files':['status-inventory.csv','status-summary.json'],
              'non_authoritative_statement':'Inventory evidence only; does not establish or change normative status.'
          }
          (out/'status-manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
      - name: Generate evidence hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum status-inventory/* | tee status-inventory/SHA256SUMS
      - name: Upload status inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: bhg-status-inventory-${{ github.sha }}
          path: status-inventory/
          if-no-files-found: error
          retention-days: 90
