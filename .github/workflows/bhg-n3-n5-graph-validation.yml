name: BHG N3-N5 Graph Validation

on:
  push:
    branches:
      - normalization/N3-N5-remediation-v0.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install YAML parser
        run: python -m pip install pyyaml
      - name: Validate relationship and authority graph
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import defaultdict
          import yaml, json, sys
          docs=sorted(Path('.').rglob('*.md'))
          docs=[p for p in docs if '.git/' not in str(p)]
          by_id={}; records=[]
          for p in docs:
              t=p.read_text(encoding='utf-8',errors='replace'); fm={}
              if t.startswith('---\n'):
                  end=t.find('\n---',4)
                  if end>=0:
                      try: fm=yaml.safe_load(t[4:end]) or {}
                      except Exception: fm={}
              did=str(fm.get('document_id',''))
              if did: by_id[did]=str(p)
              records.append((str(p),did,fm))
          unresolved=[]; edges=[]; authority=defaultdict(set)
          relkeys=['governed_by','governs','depends_on','related_to']
          def values(v):
              if v is None:return []
              if isinstance(v,list):return [str(x) for x in v]
              return [str(v)]
          for path,did,fm in records:
              for key in relkeys:
                  for target in values(fm.get(key)):
                      if target not in by_id:
                          unresolved.append({'source':path,'relationship':key,'target':target})
                          continue
                      edges.append((did,key,target))
                      if key=='governed_by': authority[did].add(target)
                      if key=='governs': authority[target].add(did)
          state={}; cycles=[]
          def dfs(n,stack):
              state[n]=1; stack.append(n)
              for nxt in authority.get(n,set()):
                  if state.get(nxt)==1:
                      i=stack.index(nxt) if nxt in stack else 0
                      cycles.append(stack[i:]+[nxt])
                  elif state.get(nxt,0)==0: dfs(nxt,stack)
              stack.pop(); state[n]=2
          for n in list(authority):
              if state.get(n,0)==0: dfs(n,[])
          duplicate_edges=[]
          seen=set()
          for e in edges:
              if e in seen: duplicate_edges.append(e)
              seen.add(e)
          out=Path('graph-evidence'); out.mkdir(exist_ok=True)
          report={'documents':len(records),'relationship_edges':len(edges),'unresolved_canonical_targets':unresolved,'authority_cycle_count':len(cycles),'authority_cycles':cycles,'duplicate_edges':duplicate_edges,'relationship_vocabulary':sorted({e[1] for e in edges})}
          (out/'n4-n5-graph-evidence.json').write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding='utf-8')
          md=['# BHG N4-N5 Graph Evidence','',f'- Documents: **{len(records)}**',f'- Canonical relationship edges: **{len(edges)}**',f'- Unresolved canonical targets: **{len(unresolved)}**',f'- Authority cycles: **{len(cycles)}**',f'- Duplicate edges: **{len(duplicate_edges)}**','']
          blockers=[]
          if unresolved:blockers.append('unresolved canonical relationship targets')
          if cycles:blockers.append('authority cycles')
          if duplicate_edges:blockers.append('duplicate relationship edges')
          md.append('**PASS — relationship/authority graph structural gate.**' if not blockers else '**FAIL:** '+', '.join(blockers))
          md.append(''); md.append('Legacy/external relationship targets are preserved under metadata extensions and are not treated as canonical documentary edges. This gate is observational and does not grant normative authority.')
          (out/'n4-n5-graph-evidence.md').write_text('\n'.join(md)+'\n',encoding='utf-8')
          print(json.dumps(report,indent=2,ensure_ascii=False))
          if blockers: sys.exit(1)
          PY
      - name: Upload graph evidence
        uses: actions/upload-artifact@v4
        with:
          name: bhg-n4-n5-graph-evidence
          path: graph-evidence/
