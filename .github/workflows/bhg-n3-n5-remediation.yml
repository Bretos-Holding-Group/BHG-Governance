name: BHG N3-N5 Controlled Remediation

on:
  push:
    branches:
      - normalization/N3-N5-remediation-v0.1
    paths:
      - tools/bhg_normalization/remediate_n3_n5.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install YAML parser
        run: python -m pip install pyyaml

      - name: Execute deterministic remediation
        run: python tools/bhg_normalization/remediate_n3_n5.py

      - name: Commit remediation result
        run: |
          git config user.name "BHG Normalization Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No remediation changes detected."
            exit 0
          fi
          git add -- '*.md' 'tools/bhg_normalization/remediate_n3_n5.py'
          git commit -m "normalization: reconcile document identity and metadata"
          git push origin HEAD:normalization/N3-N5-remediation-v0.1