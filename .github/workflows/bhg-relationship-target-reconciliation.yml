name: BHG Relationship Target Reconciliation

on:
  push:
    branches:
      - normalization/N3-N5-remediation-v0.1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install YAML parser
        run: python -m pip install pyyaml
      - name: Canonicalize relationship targets
        run: python tools/bhg_normalization/canonicalize_relationship_targets.py
      - name: Commit reconciliation
        run: |
          git config user.name "BHG Normalization Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Relationship targets already reconciled."
            exit 0
          fi
          git add -- '*.md'
          git commit -m "normalization: canonicalize relationship targets"
          git push origin HEAD:normalization/N3-N5-remediation-v0.1